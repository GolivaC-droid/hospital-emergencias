<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepción de Emergencias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container py-5">

        <h1 class="text-center mb-5">
            Sistema de Recepción de Emergencias
        </h1>

        <div class="row">

            <!-- FORMULARIO -->
            <div class="col-md-4">

                <div class="card shadow">

                    <div class="card-body">

                        <h3 class="mb-4">
                            Registrar Paciente
                        </h3>

                        <form id="formPaciente">

                            <input
                                type="text"
                                id="nombreCompleto"
                                class="form-control mb-3"
                                placeholder="Nombre completo"
                                required
                            >

                            <textarea
                                id="sintomas"
                                class="form-control mb-3"
                                placeholder="Síntomas"
                                required
                            ></textarea>

                            <input
                                type="number"
                                id="nivelGravedad"
                                class="form-control mb-3"
                                placeholder="Nivel de gravedad (1-5)"
                                min="1"
                                max="5"
                                required
                            >

                            <input
                                type="text"
                                id="carnetMedico"
                                class="form-control mb-3"
                                placeholder="Carnet Médico"
                                required
                            >

                            <button class="btn btn-primary w-100">
                                Registrar
                            </button>

                        </form>

                        <div id="mensaje" class="mt-3"></div>

                    </div>

                </div>

            </div>

            <!-- TABLA -->
            <div class="col-md-8">

                <div class="card shadow">

                    <div class="card-body">

                        <h3 class="mb-4">
                            Lista de Pacientes
                        </h3>

                        <table class="table table-hover">

                            <thead>

                                <tr>
                                    <th>ID</th>
                                    <th>Paciente</th>
                                    <th>Síntomas</th>
                                    <th>Gravedad</th>
                                </tr>

                            </thead>

                            <tbody id="tablaPacientes">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
